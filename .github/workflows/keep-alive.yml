name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 12 * * *'  # every day at 12:00 UTC
  workflow_dispatch:       # allows manually running it from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to prevent it from sleeping
        run: |
          curl -sSf -A "Mozilla/5.0 (keep-alive-ping)" \
            https://belabarbosa-projects-great-food-company.streamlit.app/ \
            -o /dev/null \
          || echo "Ping did not succeed — app may need a manual check"
